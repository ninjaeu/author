name: Android build

on:
  push:
    branches: [claude/billable-hours-excel-integration-4ov8x4]
    paths: ['android-simpletimetracker/**', '.github/workflows/android-build.yml']
  pull_request:
    paths: ['android-simpletimetracker/**', '.github/workflows/android-build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android-simpletimetracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (domain and data modules)
        run: ./gradlew :domain:test :data_local:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assemblePlayDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-time-tracker-billing-debug
          path: android-simpletimetracker/app/build/outputs/apk/play/debug/*.apk
          if-no-files-found: error
